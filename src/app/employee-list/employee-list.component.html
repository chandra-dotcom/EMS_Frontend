
    <h1 class="mb-4">Employee List</h1>
    <div>
        <table class="table table-bordered table-striped table-hover">
            <thead class="thead-dark">
                <tr>
                    <th>First Name</th>
                    <th>Last Name</th>
                    <th>Email Id</th>
                    <th>Actions</th>
                </tr>
            </thead>
            <tbody>
                <tr *ngFor="let employee of employees">
                    <td>{{ employee.firstName }}</td>
                    <td>{{ employee.lastName }}</td>
                    <td>{{ employee.emailId }}</td>
                    <td>
                        <button (click) = "updateEmployee(employee.id)" class="btn btn-primary">Update</button>
                        <button (click) = "employeeDetails(employee.id)" class="btn btn-success" style="margin-left: 10px;">View</button>
                        <button (click) = "deleteEmployee(employee.id)" class="btn btn-danger" style="margin-left: 10px;">Delete</button>
                    </td>
                </tr>
            </tbody>
        </table>
    </div>
